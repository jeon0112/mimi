name: 정부 AI/AX 지원사업 자동 수집

on:
  schedule:
    - cron: '0 23 * * *'  # 매일 UTC 23:00 = 한국 오전 8시 (KST = UTC+9)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install anthropic requests python-dotenv openpyxl

      - name: AI/AX 지원사업 수집 및 이메일 발송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          GOV_DATA_API_KEY: ${{ secrets.GOV_DATA_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python run_gov_ai.py

      - name: 결과 파일 업로드 (아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 정부AI지원사업-${{ github.run_id }}
          path: |
            output/gov_ai_*.json
            output/gov_ai_*.xlsx
          retention-days: 30
